name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger
  repository_dispatch:  # Allow trigger from other repos (e.g., chap-core)
    types: [trigger-deploy]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # mkdocs-multirepo-plugin imports dataclasses._MISSING_TYPE, which Python 3.15 removed.
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch external documentation
        run: python scripts/fetch-external-docs.py

      - name: Deploy
        run: mkdocs gh-deploy --force
