site_name: DHIS2 Modeling
site_url: https://chap.dhis2.org
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: white
      accent: blue
  logo: assets/images/dhis2modeling_logo.svg
  favicon: assets/images/Chap_icon.svg
  font:
    text: Roboto
    code: Roboto Mono
extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/webinar.css

extra:
  generator: false

# Add header/footer templates
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js

plugins:
  - search
  - markdown-exec
  - panzoom:
      full_screen: true
      always_show_hint: true
  - multirepo:
      cleanup: true
  - mkdocs-video:
      css_style:
        width: "100%"
        aspect-ratio: "16 / 9"
        height: "auto"
        max-height: "60vh"
        object-fit: "cover"

markdown_extensions:
  - toc:
      toc_depth: "1-1"
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.blocks.caption

nav:
  - Home: index.md
  - "Chap Modeling Platform": "!import https://github.com/dhis2-chap/chap-core?branch=master"
  - "Climate Data": climate-data/index.md
  - "Community":
      - community/support.md
      - community/newsletter.md
      - Contributing:
          - community/contributing/contribute_model.md
          - community/contributing/contribute_code.md
  - "Research":
      - research/publications.md
  - "About":
      - about/index.md
      - about/motivation.md
      - Partners: about/partners.md
      - about/roadmap.md
