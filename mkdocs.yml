site_name: DHIS2 Modeling
site_url: https://chap.dhis2.org
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: white
      accent: blue
  logo: assets/images/dhis2modeling_logo.svg
  favicon: assets/images/Chap_icon.svg
  font:
    text: Roboto
    code: Roboto Mono
extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/webinar.css

extra:
  generator: false

# Add header/footer templates
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js

plugins:
  - search
  - markdown-exec
  - panzoom:
      full_screen: true
      always_show_hint: true
  - multirepo:
      cleanup: true
  - mkdocs-video:
      css_style:
        width: "100%"
        aspect-ratio: "16 / 9"
        height: "auto"
        max-height: "60vh"
        object-fit: "cover"
  # Writes llms.txt and llms-full.txt, an index of the docs for AI assistants and coding agents.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Chap (the Chap Modeling Platform) runs climate and health forecasting models, evaluates them
        and connects them to DHIS2 through the DHIS2 Modeling App.
        A Chap model is a train script and a predict script in R or Python, plus an MLproject file
        that describes them. It is evaluated locally with `chap eval --run-config.as-chapkit`,
        from the `chap-core` package (`uv tool install chap-core`), and deployed as a chapkit Docker image.
        A model developer does not install chapkit separately, does not run the chap-core
        `docker compose` stack and does not need `chapkit mlproject migrate`.
        Start with "Getting started as a model developer" and "Bring your existing model to Chap".
      sections:
        Model developers:
          # Getting started first, then everything else.
          - chap-modeling-platform/external_models/index.md
          - chap-modeling-platform/external_models/setup.md
          - chap-modeling-platform/external_models/existing_model.md
          - chap-modeling-platform/external_models/mlproject_tutorial.md
          - chap-modeling-platform/external_models/*.md
          - chap-modeling-platform/chap-cli/*.md
        DHIS2 implementers:
          - chap-modeling-platform/modeling-app/*.md
        About Chap:
          - index.md
          - about/*.md

markdown_extensions:
  - toc:
      toc_depth: "1-1"
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.blocks.caption

nav:
  - Home: index.md
  - "Chap Modeling Platform": "!import https://github.com/dhis2-chap/chap-core?branch=master"
  - "Climate Data": climate-data/index.md
  - "Community":
      - community/support.md
      - community/newsletter.md
      - Contributing:
          - community/contributing/contribute_model.md
          - community/contributing/contribute_code.md
  - "Research":
      - research/publications.md
  - "About":
      - about/index.md
      - about/motivation.md
      - Partners: about/partners.md
      - about/roadmap.md
